# rivewm configuration
#
# Reload with Alt+Shift+C after editing. Delete this file to get the defaults
# back on the next start. Any section you leave out uses its default.

[gaps]
# Space between tiled windows, in pixels.
inner = 8
# Space between windows and the edge of the screen (not counting the taskbar).
outer = 8

[layout]
# How new windows are placed on new workspaces:
#   "dwindle"  Hyprland style: each new window takes half of the focused one,
#              side by side if it's wider than tall, stacked otherwise.
#              toggle-split flips the focused window's split right away.
#   "manual"   i3 style: new windows open beside the focused one, in the
#              direction you last picked with toggle-split.
# Change the focused workspace's layout any time with the `layout` command.
default = "dwindle"

[border]
# Colour the focused window's border so it's easy to spot, like Hyprland.
# Uses Windows 11's own 1px window border, which follows the window exactly.
enabled = true
# Colours are "#rrggbb", or "default" (Windows' usual border) or "none".
focused = "#33ccff"
# Every other window rivewm manages.
unfocused = "#595959"

[programs]
# Programs to start with rivewm, as you'd type them in the Run dialog
# (Win+R): a full path, something on PATH, or an app name like "wt".
# %VARIABLES% are expanded. Put a path with spaces in double quotes, inside
# single-quoted TOML: '"C:\Program Files\App\app.exe" --flag'
#
# Started every time rivewm starts. Good for things that belong with the
# WM, like a status bar (list those in stop_on_exit too).
exec = []
# Started only the first time rivewm starts after you log in, so restarting
# rivewm doesn't open them again.
exec_once = []
# Executable names (as in Task Manager's Details tab) to close when rivewm
# quits. They're force-closed, so unsaved work in them is lost.
stop_on_exit = []
# For example:
#   exec = ["rivewm-bar"]
#   exec_once = ["wt", '%LOCALAPPDATA%\Discord\Update.exe --processStart Discord.exe']
#   stop_on_exit = ["rivewm-bar.exe"]

[focus]
# Focus whichever window the mouse moves over, like Hyprland's
# follow_mouse. Only reacts to the mouse moving, so focusing with the
# keyboard isn't undone by a cursor resting on another window.
follows_mouse = false

[resize]
# Resize neighbouring windows live while you drag a window's edge. Turn this
# off if an app struggles to keep up (File Explorer can lag or glitch); the
# neighbours then adjust when you let go instead.
live = true

[floating]
# Keep floating windows (dialogs, picture-in-picture, anything toggled with
# toggle-floating) above tiled windows. Uses Windows' "always on top", so
# they also stay above other apps' windows while visible.
on_top = false

# Hotkey = command.
#
# Modifiers: alt, ctrl, shift, win
# Keys:      a-z, 0-9, f1-f24, left, right, up, down, enter, space, tab,
#            escape, backspace, delete, minus, equal, comma, period, semicolon
#
# Commands:
#   focus <left|right|up|down>      move <left|right|up|down>
#   workspace <name>                move-to-workspace <name>
#   split <horizontal|vertical>     toggle-split
#   toggle-floating                 toggle-fullscreen
#   layout <dwindle|manual>
#   resize <left|right|up|down> N   (move an edge that way, percent of monitor)
#   resize <width|height> <+N|-N>   (percent of the containing split)
#   exec <program and arguments>    (as in [programs], e.g. exec wt)
#   retile                          reload-config
#   quit
#
# A hotkey another app has already claimed is skipped with a warning.
# This section replaces the defaults as a whole, so keep every binding you
# want here.
[keybindings]
"alt+enter" = "exec wt"
"alt+h" = "focus left"
"alt+j" = "focus down"
"alt+k" = "focus up"
"alt+l" = "focus right"
"alt+left" = "focus left"
"alt+down" = "focus down"
"alt+up" = "focus up"
"alt+right" = "focus right"

"alt+shift+h" = "move left"
"alt+shift+j" = "move down"
"alt+shift+k" = "move up"
"alt+shift+l" = "move right"
"alt+shift+left" = "move left"
"alt+shift+down" = "move down"
"alt+shift+up" = "move up"
"alt+shift+right" = "move right"

"alt+v" = "toggle-split"
"alt+shift+space" = "toggle-floating"
"alt+f" = "toggle-fullscreen"

"alt+ctrl+l" = "resize right 5"
"alt+ctrl+h" = "resize left 5"
"alt+ctrl+j" = "resize down 5"
"alt+ctrl+k" = "resize up 5"
"alt+ctrl+right" = "resize right 5"
"alt+ctrl+left" = "resize left 5"
"alt+ctrl+down" = "resize down 5"
"alt+ctrl+up" = "resize up 5"

"alt+1" = "workspace 1"
"alt+2" = "workspace 2"
"alt+3" = "workspace 3"
"alt+4" = "workspace 4"
"alt+5" = "workspace 5"
"alt+6" = "workspace 6"
"alt+7" = "workspace 7"
"alt+8" = "workspace 8"
"alt+9" = "workspace 9"
"alt+shift+1" = "move-to-workspace 1"
"alt+shift+2" = "move-to-workspace 2"
"alt+shift+3" = "move-to-workspace 3"
"alt+shift+4" = "move-to-workspace 4"
"alt+shift+5" = "move-to-workspace 5"
"alt+shift+6" = "move-to-workspace 6"
"alt+shift+7" = "move-to-workspace 7"
"alt+shift+8" = "move-to-workspace 8"
"alt+shift+9" = "move-to-workspace 9"

"alt+shift+r" = "retile"
"alt+shift+c" = "reload-config"
"alt+shift+e" = "quit"

# Window rules decide how new windows are handled. The first matching rule
# wins, and rules apply when a window opens (not to windows already open when
# you reload).
#
# Match on any combination of:
#   process = "Spotify.exe"     executable name, any case
#   class   = "CabinetWClass"   window class, exact (see `rivewm --list --all`)
#   title   = "regex"           regular expression on the window title
#
# Then apply either or both of:
#   action    = "float" | "tile" | "ignore"
#   workspace = "3"
#
# Examples:
#
# [[rules]]
# process = "Spotify.exe"
# workspace = "9"
#
# [[rules]]
# title = "^Picture-in-picture$"
# action = "float"
